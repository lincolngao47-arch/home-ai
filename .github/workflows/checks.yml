name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r dashboard/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q dashboard scripts
      - run: node --check dashboard/app.js
      - run: node --check webui/loader.js
      - run: for file in scripts/*.sh; do bash -n "$file"; done
      - run: python scripts/export_source.py
